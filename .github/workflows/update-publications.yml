# Publication update — run by hand from the Actions tab ("Update publications" → Run workflow).
# Runs scripts/update_publications.py against the SciX/ADS library and opens a pull
# request with new papers and updated entries. Nothing goes live until you merge it:
# review the PR, delete any folder you don't want (in the PR branch), then merge.
#
# One-time setup on GitHub:
#  1. Settings → Secrets and variables → Actions → New repository secret:
#       name ADS_API_TOKEN, value = your token from https://scixplorer.org/user/settings/token
#  2. Settings → Actions → General → Workflow permissions:
#       tick "Allow GitHub Actions to create and approve pull requests".

name: Update publications

on:
  workflow_dispatch:          # manual only — no schedule
    inputs:
      since:
        description: "Only add NEW papers from this year onwards (leave empty for all)"
        required: false
        default: ""
      update_existing:
        description: "Also update existing entries (journal refs, DOIs, PDF links)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools (optional helpers used by the script)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          pip install --quiet pillow

      - name: Run the publication script
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
          SINCE: ${{ inputs.since }}
          UPDATE_EXISTING: ${{ inputs.update_existing }}
        run: |
          ARGS=""
          if [[ "$SINCE" =~ ^[0-9]{4}$ ]]; then ARGS="$ARGS --since $SINCE"; fi
          if [ "$UPDATE_EXISTING" = "false" ]; then ARGS="$ARGS --no-update"; fi
          python3 scripts/update_publications.py $ARGS | tee update-log.txt
          {
            echo "Publication update from the SciX/ADS library (run by hand)."
            echo
            echo "**Before merging:** check the summary, tags and image caption of new papers,"
            echo "and delete any folder you don't want (it will not be proposed again)."
            echo "Alternative figures are attached to the workflow run as the \`candidate-figures\` artifact."
            echo
            echo '```'
            cat update-log.txt
            echo '```'
          } > pr-body.md

      - name: Keep alternative figures (download from the workflow run)
        if: hashFiles('scripts/_candidates/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-figures
          path: scripts/_candidates/
          retention-days: 30

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/publication-update
          delete-branch: true
          add-paths: |
            content/publication/**
            scripts/.autopub_seen.json
          commit-message: "Publication update"
          title: "Publication update"
          body-path: pr-body.md
          labels: publications
